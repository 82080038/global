[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Professional trading decision system - Phase 1"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.28",
    "pyarrow>=12.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "plotly>=5.15.0",
    "python-dateutil>=2.8.2",
    "schedule>=1.2.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.0",
    "feedparser>=6.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
sentiment = [
    "pytrends>=4.9.0",
    "praw>=7.7.0",
    "tweepy>=4.14.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
e2e = [
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore:Degrees of freedom <= 0 for slice:RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "B007", "F841", "SIM102", "SIM103", "SIM105", "SIM110", "SIM114", "B019", "E741", "E731", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["trading_system"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.coverage.run]
source = ["src/trading_system"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
